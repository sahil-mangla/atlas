name: CI

# Every job here runs with no API keys and no access to an AI provider:
# tests block outbound sockets, and anything that needs a model uses the
# deterministic SCRIPTED protocol.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - name: pytest (unit, loopback HTTP, black-box CLI)
        run: uv run pytest

  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - name: Benchmark suite against the scripted provider
        run: >
          uv run python -m evals
          --ai-protocol SCRIPTED --ai-model scripted
          --baseline-path evals/baselines/scripted.json
          --no-latency-check

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Build wheel and sdist
        run: uv build
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
      - name: Run the full pipeline from the installed package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin="Scripts"; ext=".exe"; else bin="bin"; ext=""; fi
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          "clean/$bin/python$ext" smoke_installed.py "$RUNNER_TEMP/clean/$bin/atlas$ext"
