[project]
name = "atlas-eng"
version = "1.1.0"
description = "ATLAS is an AI-native engineering operating system that transforms ideas into production-ready software through structured research, architecture, planning, implementation, verification, and persistent project intelligence."
requires-python = ">=3.12"
authors = [{ name = "sahil-mangla" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "llm",
    "software-engineering",
    "architecture",
    "planning",
    "human-in-the-loop",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The README is rendered by a build hook (below) so its relative links also
# work on the PyPI project page.
dynamic = ["readme"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
# The Gemini protocol (the default ATLAS_AI_PROTOCOL) needs Google's SDK.
gemini = ["google-genai>=1.0.0"]
# Sends traces to Langfuse when LANGFUSE_PUBLIC_KEY/SECRET_KEY are set.
langfuse = ["langfuse>=2.21.0,<3.0.0"]
all = ["atlas-eng[gemini,langfuse]"]

[project.urls]
Homepage = "https://github.com/sahil-mangla/atlas"
Documentation = "https://github.com/sahil-mangla/atlas/blob/main/docs/README.md"
Repository = "https://github.com/sahil-mangla/atlas"
Issues = "https://github.com/sahil-mangla/atlas/issues"
Changelog = "https://github.com/sahil-mangla/atlas/blob/main/CHANGELOG.md"

[project.scripts]
atlas = "atlas_eng.clients.cli.application:main"
# Same command under the distribution name, so `uvx atlas-eng demo` works.
atlas-eng = "atlas_eng.clients.cli.application:main"

[dependency-groups]
dev = [
    # Optional extras are installed for development so tests and type
    # checks cover them.
    "google-genai>=1.0.0",
    "langfuse>=2.21.0,<3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.12.20260815",
    "pytest-socket>=0.8.1",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_eng"]

[tool.hatch.build.targets.sdist]
# An explicit list: hatch otherwise ships every file git does not ignore,
# which can include local, untracked files.
include = [
    "atlas_eng",
    "tests",
    "evals",
    "docs",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    ".env.example",
]
exclude = ["evals/runs", "**/__pycache__"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Relative links resolve against the PyPI page, where they 404; point them
# at the repository instead. Absolute URLs and in-page anchors are kept.
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/sahil-mangla/atlas/blob/main/\1)'

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-usepathlib
    "ERA", # erricate (dead code)
    "PL",  # pylint
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Magic-value comparisons (e.g. `assert len(x) == 2`) are the normal, readable
# way to write test assertions; extracting a named constant per literal adds
# indirection without improving clarity.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
exclude = [
    "^\\.venv/",
]

[[tool.mypy.overrides]]
# sqlite-vec ships no type stubs or py.typed marker.
module = ["sqlite_vec"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# langfuse 2.x ships no py.typed marker, so its imports and the @observe
# decorator are untyped.
module = ["langfuse", "langfuse.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "8.0"
# Sockets are disabled so a test that reaches a real service fails instead of
# passing by accident; loopback stays open for the fake provider server in
# tests/ai/test_http_loopback.py.
addopts = "-ra -q --disable-socket --allow-hosts=127.0.0.1,localhost,::1 --cov=atlas_eng --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]
